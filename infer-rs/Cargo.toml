[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Release: maximize runtime performance
[profile.release]
lto = "fat"              # cross-crate link-time optimization
codegen-units = 1        # single codegen unit for best optimization
opt-level = 3            # maximum optimization
strip = "symbols"        # strip debug symbols from binary
panic = "abort"          # no unwinding overhead

# Dev: keep builds fast
[profile.dev]
opt-level = 0
debug = true

# Test: slight optimization so tests run faster without sacrificing build time
[profile.test]
opt-level = 1

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }

# Logging
log = "0.4"

# Arbitrary precision integers (for IntLit)
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
