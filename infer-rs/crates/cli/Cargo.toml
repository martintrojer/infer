[package]
name = "infer-rs"
description = "infer-rs: Rust implementation of the Infer static analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "infer-rs"
path = "src/main.rs"

[dependencies]
sil = { path = "../sil" }
textual = { path = "../textual" }
absint = { path = "../absint" }
analyses = { path = "../analyses" }
diagnostics = { path = "../diagnostics" }
pulse = { path = "../pulse" }
ondemand = { path = "../ondemand" }
config = { path = "../config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
log = { workspace = true }
env_logger = "0.11"

[dev-dependencies]
serde_json = "1"
diagnostics = { path = "../diagnostics" }
test-harness = { path = "../test-harness" }
